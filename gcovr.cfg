# Coverage report for the unit tests, see the coverage env in platformio.ini:
#   pio test -e coverage && gcovr
root = .
search-path = .pio/build/coverage
filter = src/
filter = include/
# Ignore the exception paths that every call to a virtual method gets.
exclude-throw-branches = yes
print-summary = yes
# Per-file table on the console.
txt = -
# Line-by-line report: open .pio/build/coverage/coverage.html in a browser.
html-details = .pio/build/coverage/coverage.html
