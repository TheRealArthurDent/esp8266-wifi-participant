name: 🐶 Reviewdog

on:
  pull_request:
    branches:
      - main

jobs:
  reviewdog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Spellcheck
        uses: reviewdog/action-misspell@v1.30.3
        with:
          reporter: github-pr-review
          fail_on_error: true
          locale: US
          ignore: mosquitto

      - name: Action lint
        uses: reviewdog/action-actionlint@v1.80.6
        with:
          reporter: github-pr-review
          fail_on_error: true

      - name: YAML lint
        uses: reviewdog/action-yamllint@v1.25.3
        with:
          reporter: github-pr-review
          fail_on_error: true

      - name: Markdown lint
        uses: reviewdog/action-markdownlint@v0.31.7
        with:
          reporter: github-pr-review
          fail_on_error: true
