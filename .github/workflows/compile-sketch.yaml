name: 🔨 Compile Sketch
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  compile-sketch:
    name: ${{ matrix.fqbn }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        fqbn:
          - esp8266:esp8266:nodemcuv2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.1.0

      - name: Prepare Arduino IDE compatibility
        shell: bash
        run: |
          cd scripts
          sh migrate_to_ino.sh

      - name: Compile sketch
        uses: arduino/compile-sketches@v1.1.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fqbn: ${{ matrix.fqbn }}
          platforms: |
            - name: esp8266:esp8266
              source-url: https://arduino.esp8266.com/stable/package_esp8266com_index.json
              # The core PlatformIO builds with (framework-arduinoespressif8266 3.30102.0).
              # renovate: datasource=github-tags depName=esp8266/Arduino
              version: 3.1.2
          sketch-paths: |
            - ./esp8266-wifi-participant
          cli-compile-flags: |
            - --preprocess
