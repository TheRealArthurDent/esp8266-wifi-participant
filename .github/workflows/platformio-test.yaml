name: 🧪 PlatformIO Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Copy secrets template
        shell: bash
        run: |
          cp secrets.ini.template secrets.ini

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: '.python-version'

      - name: Cache PlatformIO
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-test-${{ hashFiles('**/requirements.txt', 'platformio.ini') }}

      - name: Install PlatformIO
        shell: bash
        run: |
          pip install -r requirements.txt

      - name: Run unit tests
        shell: bash
        run: |
          pio test -e unit_test -e unit_test_DEBUG

      - name: Measure unit test coverage
        shell: bash
        run: |
          pio test -e coverage
          gcovr --markdown "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-report
          path: .pio/build/coverage/coverage*.html
