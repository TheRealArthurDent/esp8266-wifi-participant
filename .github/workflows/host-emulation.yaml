name: 🖥️ Host Emulation Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Cache ESP8266 core
        uses: actions/cache@v5.1.0
        with:
          path: .pio/host-emulation/arduino-*
          key: ${{ runner.os }}-host-emulation-${{ hashFiles('test-host/run.sh', 'test-host/core-host-emulation.patch') }}

      - name: Run host emulation tests
        shell: bash
        run: |
          test-host/run.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: host-emulation-logs
          path: .pio/host-emulation/logs/
