name: 🔍 CPP Lint Full

on:
  push:
    branches:
      - main
      - renovate/cpp-linter-**
  workflow_dispatch:

permissions:
  issues: write

jobs:
  cpp-lint-full:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: '.python-version'

      # Unity and ArduinoFake, so clang-tidy finds the headers the tests use.
      - name: Install test libraries
        shell: bash
        run: |
          cp secrets.ini.template secrets.ini
          pip install -r requirements.txt
          pio pkg install -e unit_test

      - name: Cpp Lint Full
        uses: cpp-linter/cpp-linter-action@v2.23.1
        id: linter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          style: file
          tidy-checks: ''
          files-changed-only: false
          # thread-comments: true - currently not working
          ignore: .github|.pio
          extra-args: -Iinclude/ -Itest/ -I.pio/libdeps/unit_test/Unity/src -I.pio/libdeps/unit_test/ArduinoFake/src

      - name: Fail fast?!
        if: steps.linter.outputs.checks-failed > 0
        shell: bash
        run: |
          echo "Some files failed the linting checks!"
          # for actual deployment
          # exit 1
